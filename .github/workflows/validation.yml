name: validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-validate:
    name: plugin-validate (VAL-01)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-claude-${{ runner.os }}-${{ hashFiles('.github/workflows/validation.yml') }}
          restore-keys: |
            npm-claude-${{ runner.os }}-
      - run: npm install -g @anthropic-ai/claude-code@latest
      - run: claude plugin validate ./first-principles

  markdownlint:
    name: markdownlint (VAL-02)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            first-principles/**/*.md
          config: .markdownlint.jsonc

  check-links:
    name: check-links (VAL-03)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pyyaml>=6.0'
      - run: python3 scripts/check-links.py

  check-trigger-collisions:
    name: check-trigger-collisions (VAL-04/GATE-02)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pyyaml>=6.0'
      - run: python3 scripts/check-trigger-collisions.py --self-test
      - run: python3 scripts/check-trigger-collisions.py

  check-description-budget:
    name: check-description-budget (VAL-05)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pyyaml>=6.0'
      - run: python3 scripts/check-description-budget.py

  sync-check:
    name: sync-check (DUAL-04)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pyyaml>=6.0'
      - run: python3 scripts/sync-content.py --check

  check-agent:
    name: check-agent (GATE-01)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pyyaml>=6.0'
      - run: python3 scripts/check-agent.py --self-test
      - run: python3 scripts/check-agent.py --file first-principles/agents/first-principles.md

  check-routing-battery:
    name: check-routing-battery (BATT-06)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-routing-battery.py --self-test

  check-step0-emulator:
    name: check-step0-emulator (STEP0-08)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-step0-emulator.py --self-test
