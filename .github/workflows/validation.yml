      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run python3 scripts/check-description-budget.py

  sync-check:
    name: sync-check (DUAL-04)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run python3 scripts/sync-content.py --check

  pointer-drift-guard:
    name: GATE-02-v8.5
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run python3 scripts/sync-content.py --self-test

  check-agent:
    name: check-agent (GATE-01)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run python3 scripts/check-agent.py --self-test
      # No --file: targets the repo-anchored AGENT_FILE constant so the gate's
      # target cannot drift. Prints a COVERAGE line naming the validated file.
      - run: uv run python3 scripts/check-agent.py

  check-routing-battery:
