      - run: uv sync --locked --group dev
      - run: uv run python3 scripts/check-install-collisions.py --self-test
      - run: uv run python3 scripts/check-install-collisions.py

  check-description-budget:
    name: check-description-budget (VAL-05)
    runs-on: ubuntu-latest
    timeout-minutes: 10
