name: validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every Python job resolves its interpreter and packages from the tracked
# recipe — pyproject.toml + uv.lock + .python-version — via `uv sync --locked`.
# `--locked` asserts uv.lock is up to date with pyproject.toml and fails the job
# if it is not, so CI and a local `uv sync --group dev` are guaranteed to run
# identical versions (currently CPython 3.12, pyyaml 6.0.3, pytest 9.1.1).
# Verified: editing a dependency without re-running `uv lock` exits 1 here.
# Do NOT substitute `--frozen`; that flag only skips re-locking and silently
# accepts a stale lockfile, which defeats the point of pinning.
#
# Scripts are invoked as `uv run python3 scripts/<name>.py`, NOT
# `uv run scripts/<name>.py`. Every script carries PEP 723 inline metadata, and
# the bare form makes uv build a fresh per-script environment that ignores
# uv.lock — which is exactly the version drift this setup exists to remove.
env:
  UV_VERSION: "0.12.6"

jobs:
  plugin-validate:
    name: plugin-validate (VAL-01)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-claude-${{ runner.os }}-${{ hashFiles('.github/workflows/validation.yml') }}
          restore-keys: |
            npm-claude-${{ runner.os }}-
      - run: npm install -g @anthropic-ai/claude-code@latest
      - run: claude plugin validate ./first-principles

  markdownlint:
    name: markdownlint (VAL-02)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            first-principles/**/*.md
          config: .markdownlint.jsonc

  check-links:
    name: check-links (VAL-03)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run python3 scripts/check-links.py --self-test
      - run: uv run python3 scripts/check-links.py
      - run: uv run python3 -m pytest scripts/check-links_anchors_test.py -q

  check-trigger-collisions:
    name: check-trigger-collisions (VAL-04/GATE-02)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run python3 scripts/check-trigger-collisions.py --self-test
      - run: uv run python3 scripts/check-trigger-collisions.py

  check-version-stamps:
    name: check-version-stamps (VERSION-01)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run python3 scripts/check-version-stamps.py --self-test
      - run: uv run python3 scripts/check-version-stamps.py

  check-install-collisions:
    name: check-install-collisions (COLLIDE-01)
    runs-on: ubuntu-latest
    timeout-minutes: 10
