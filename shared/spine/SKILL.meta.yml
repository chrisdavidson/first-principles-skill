agent:
  name: first-principles
  description: "Runs a complete first-principles analysis end-to-end: decomposes the problem into verified ground truths, challenges every assumption, and reasons upward to a validated conclusion. Applies all six companion techniques (5-Whys, fishbone, inversion, pre-mortem, trade-off, second-order thinking) internally. Delegate when the user asks to: analyze from first principles, challenge assumptions, reason from ground truth, decompose this problem into its foundations, question a design, or stress-test reasoning. Use when the user needs to identify fundamental ground truths or reason up from first principles to a conclusion. Not for routine code review, debugging, performance optimization, or general Q&A."
  license: MIT
  metadata:
    version: '3.0.0'
  disallowedTools: [Write, Edit]
  maxTurns: 30
  AskUserQuestion: permitted
